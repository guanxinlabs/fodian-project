current_constraints:
  - 《无量义经》三品全文分段 V1 已由维护者确认并锁定，共46个学习单元。
  - 所有段号、单元ID和原文起止必须严格继承 01 无量义经/00 无量义经-分段控制表.md。
  - 研习模板 V2 固定体例为：原文 → 拼音读本 → 白话通译 → 字词名相 → 经义研习 → 行持。
  - 原文栏目必须保持纯经文；拼音读本独立为第二部分，并继承 02 拼音阅读对应内容。
  - 拼音采用“以词为主、单字为辅”：佛教专名/音译词/人名/地名/固定难读词整词标音，普通生僻字或易误读字单字标音，常见字词不标。
  - 白话通译必须保持原文信息完整：可调整现代汉语句式，但不得为简洁或通顺省略原文已明确列出的名称、数量、项目、次第、对象、条件等信息；原文明列，译文亦明列。
  - 列名、列数、列项段落不得用“等”“若干”“其中包括”等概括性表达替代原文已逐项写出的具体内容；专名和名号原则上沿用本经写法，现代通称按规则另作说明。
  - 字词名相以初学者为默认读者；凡初学者可能自然产生“这是什么、怎么读、为什么这样叫、从哪里来”的问题，都应考虑解释，但只解释到足以继续读经。
  - 自 WLYJ-P01-006 起，字词名相内部固定顺序为：名相 → 【本经原句】 → 【本句白话】 → 基本解释 → 必要词源/来历 → 必要互证；引用本句不足以理解时可连带必要前后句，确保单独查看名相也能看懂。
  - 第一至第五段已经正式收口，不因本次规则优化机械批量重写；后续统一回看时再按需要归一。
  - 研习正文只引用经典本身；不展示“CBETA所收”“某数据库可见”“某网站记载”等资料库或检索来源。数据库、版本、工具书仅用于后台核验；确需引用祖师释义时，只标祖师及具体著作，不把数据库来源写入正文。
  - 经义研习优先本段作用、同经互证、必要三经互证；祖师/高僧解释单列【祖师释义】，不得以释代经。
  - 日常逐段流程固定为：“下一段” → 共同研习与提问 → “确认本段，存入佛典” → 正式同步 → 自动推进 next_unit。
  - “确认本段，存入佛典”触发当前单元闭环：核对01/分段边界，同步02/05/06，并按条件同步03/07/08/99，完成一致性检查后提交GitHub main。
  - 学习中未可靠解决的问题保留为待核问题；不得为了完成当前单元强行定论。
  - GitHub main 是唯一正式成果源；换会话、换模型、换工具必须重新执行恢复流程。
  - 已锁定边界如需调整，必须执行正式变更流程并保留新旧对应关系。

