name: tmp-sync-wlyj-p03-005

on:
  push:
    branches:
      - tmp-sync-wlyj-p03-005

permissions:
  contents: write

jobs:
  sync-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-sync-wlyj-p03-005
          fetch-depth: 0
      - name: Apply confirmed unit
        run: |
          python3 scripts/tmp_sync_wlyj_p03_005.py
      - name: Validate diff
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              '00 佛典项目-状态清单.yaml',
              '00 佛典项目当前状态与共识.md',
              '01 无量义经/03 无量义经-经文行法.md',
              '01 无量义经/05 无量义经-白话通译.md',
              '01 无量义经/06 无量义经-经义研习.md',
              '01 无量义经/07 无量义经-关键词索引.md',
          }
          actual = set(subprocess.check_output(['git','diff','--name-only','-z']).decode().split('\0'))
          actual.discard('')
          if actual != expected:
              raise SystemExit(f'changed files mismatch: {actual}')
          PY
      - name: Commit generated files
        run: |
          git config user.name "Guanxin Lab | 观心研习社"
          git config user.email "guancheng4968@gmail.com"
          git add -- "00 佛典项目-状态清单.yaml" "00 佛典项目当前状态与共识.md" "01 无量义经/03 无量义经-经文行法.md" "01 无量义经/05 无量义经-白话通译.md" "01 无量义经/06 无量义经-经义研习.md" "01 无量义经/07 无量义经-关键词索引.md"
          git diff --cached --check
          git commit -m "tmp: close WLYJ-P03-005"
          git push origin HEAD:tmp-sync-wlyj-p03-005
