name: tmp-fix-wlyj-p03-005-state

on:
  push:
    branches:
      - tmp-sync-wlyj-p03-005

permissions:
  contents: write

jobs:
  fix-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-sync-wlyj-p03-005
          fetch-depth: 0
      - name: Repair current-state wording
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('00 佛典项目当前状态与共识.md')
          s = p.read_text(encoding='utf-8')
          old1 = '- 当前已完成 `WLYJ-P03-004`（十功德品第三第4段｜第一功德：转诸不善心为菩提善行）；下一学习单元为 `WLYJ-P03-006`（十功德品第三第6段｜第三功德：虽未自度而能度彼）。所有段号、单元ID和原文起止严格继承 `00 无量义经-分段控制表.md`。'
          new1 = '- 当前已完成 `WLYJ-P03-005`（十功德品第三第5段｜第二功德：一文一句生无量义）；下一学习单元为 `WLYJ-P03-006`（十功德品第三第6段｜第三功德：虽未自度而能度彼）。所有段号、单元ID和原文起止严格继承 `00 无量义经-分段控制表.md`。'
          old2 = '- 下一学习单元：`WLYJ-P03-005`（十功德品第三第5段｜第二功德：一文一句生无量义）。'
          new2 = '- 下一学习单元：`WLYJ-P03-006`（十功德品第三第6段｜第三功德：虽未自度而能度彼）。'
          for old,new in [(old1,new1),(old2,new2)]:
              if s.count(old) != 1:
                  raise SystemExit('state repair target mismatch: '+old[:60])
              s = s.replace(old,new,1)
          p.write_text(s.rstrip()+'\n', encoding='utf-8')
          PY
          git add -- "00 佛典项目当前状态与共识.md"
          git diff --cached --check
          ! git diff --cached --quiet
      - name: Commit repair
        run: |
          git config user.name "Guanxin Lab | 观心研习社"
          git config user.email "guancheng4968@gmail.com"
          git commit -m "tmp: repair WLYJ-P03-005 state wording"
          git push origin HEAD:tmp-sync-wlyj-p03-005
