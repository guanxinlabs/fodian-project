name: tmp-sync-wlyj-p03-004

on:
  push:
    branches:
      - tmp-sync-wlyj-p03-004

permissions:
  contents: write

jobs:
  sync-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-sync-wlyj-p03-004
          fetch-depth: 0
      - name: Fix append marker and apply confirmed unit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/tmp_sync_wlyj_p03_004.py')
          s = p.read_text(encoding='utf-8')
          old = "append_once('01 无量义经/06 无量义经-经义研习.md', '`WLYJ-P03-004`', BLOCK06)"
          new = "append_once('01 无量义经/06 无量义经-经义研习.md', '### 第四段｜第一功德：转诸不善心为菩提善行', BLOCK06)"
          if s.count(old) != 1:
              raise SystemExit('expected one 06 append marker line')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python3 scripts/tmp_sync_wlyj_p03_004.py
          git checkout -- scripts/tmp_sync_wlyj_p03_004.py
      - name: Validate diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "00 佛典项目-状态清单.yaml 00 佛典项目当前状态与共识.md 01 无量义经/03 无量义经-经文行法.md 01 无量义经/05 无量义经-白话通译.md 01 无量义经/06 无量义经-经义研习.md "
      - name: Commit generated files
        run: |
          git config user.name "Guanxin Lab | 观心研习社"
          git config user.email "guancheng4968@gmail.com"
          git add -- "00 佛典项目-状态清单.yaml" "00 佛典项目当前状态与共识.md" "01 无量义经/03 无量义经-经文行法.md" "01 无量义经/05 无量义经-白话通译.md" "01 无量义经/06 无量义经-经义研习.md"
          git diff --cached --check
          git diff --cached --name-only
          git commit -m "tmp: close WLYJ-P03-004"
          git push origin HEAD:tmp-sync-wlyj-p03-004
