name: tmp-sync-wlyj-p03-006

on:
  push:
    branches:
      - tmp-sync-wlyj-p03-006

permissions:
  contents: write

jobs:
  sync-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-sync-wlyj-p03-006
          fetch-depth: 0
      - name: Apply confirmed unit
        run: python3 scripts/tmp_sync_wlyj_p03_006.py
      - name: Normalize target files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              '00 佛典项目-状态清单.yaml',
              '00 佛典项目当前状态与共识.md',
              '01 无量义经/03 无量义经-经文行法.md',
              '01 无量义经/05 无量义经-白话通译.md',
              '01 无量义经/06 无量义经-经义研习.md',
              '01 无量义经/07 无量义经-关键词索引.md',
          ]
          for name in files:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = '\n'.join(line.rstrip(' \t') for line in text.splitlines()).rstrip() + '\n'
              p.write_text(text, encoding='utf-8')
          PY
      - name: Stage and validate
        run: |
          git add -- "00 佛典项目-状态清单.yaml" "00 佛典项目当前状态与共识.md" "01 无量义经/03 无量义经-经文行法.md" "01 无量义经/05 无量义经-白话通译.md" "01 无量义经/06 无量义经-经义研习.md" "01 无量义经/07 无量义经-关键词索引.md"
          git diff --cached --check
          ! git diff --cached --quiet
      - name: Commit generated files
        run: |
          git config user.name "Guanxin Lab | 观心研习社"
          git config user.email "guancheng4968@gmail.com"
          git commit -m "tmp: close WLYJ-P03-006"
          git push origin HEAD:tmp-sync-wlyj-p03-006
