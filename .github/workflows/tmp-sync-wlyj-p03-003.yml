      - name: Commit generated files
        run: |
          git config user.name 'Guanxin Lab | 观心研习社'
          git config user.email 'guancheng4968@gmail.com'
          git add -- '01 无量义经/05 无量义经-白话通译.md' '01 无量义经/06 无量义经-经义研习.md' '00 佛典项目-状态清单.yaml' '00 佛典项目当前状态与共识.md'
