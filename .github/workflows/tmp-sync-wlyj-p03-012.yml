name: tmp-sync-wlyj-p03-012
on:
  push:
    branches: [tmp-sync-wlyj-p03-012]
    paths:
      - '.github/workflows/tmp-sync-wlyj-p03-012.yml'
jobs:
  sync-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-sync-wlyj-p03-012
          fetch-depth: 0
      - name: Apply confirmed unit
        run: python scripts/tmp_sync_wlyj_p03_012.py
      - name: Stage and validate
        run: |
          git add -- '00 佛典项目-状态清单.yaml' '00 佛典项目当前状态与共识.md' '01 无量义经/03 无量义经-经文行法.md' '01 无量义经/05 无量义经-白话通译.md' '01 无量义经/06 无量义经-经义研习.md' '01 无量义经/07 无量义经-关键词索引.md'
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 6
      - name: Commit generated files
        run: |
          git config user.name 'Guanxin Lab | 观心研习社'
          git config user.email 'guancheng4968@gmail.com'
          git commit -m 'tmp: close WLYJ-P03-012'
          git push origin HEAD:tmp-sync-wlyj-p03-012
