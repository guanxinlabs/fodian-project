name: tmp-sync-wlyj-p03-001

on:
  push:
    branches:
      - tmp-sync-wlyj-p03-001

permissions:
  contents: write

jobs:
  append-study-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-sync-wlyj-p03-001
          fetch-depth: 0
      - name: Append study unit
        run: python .tmp_append_wlyj_p03_001.py
      - name: Commit appended ledger
        shell: bash
        run: |
          git config user.name 'fodian-sync-bot'
          git config user.email 'fodian-sync-bot@users.noreply.github.com'
          git add '01 无量义经/06 无量义经-经义研习.md'
          if git diff --cached --quiet; then
            echo 'No ledger change.'
            exit 0
          fi
          git commit -m 'tmp: append WLYJ-P03-001 to 06'
          git push origin HEAD:tmp-sync-wlyj-p03-001
